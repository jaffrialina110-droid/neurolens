name: NeuroLens Phase 1 checks

on:
  push:
    branches: [neurolens-platform-phase1]
  pull_request:
    branches: [main]
    paths:
      - "modules/auth.py"
      - "modules/storage.py"
      - "modules/config.py"
      - "tests/**"
      - ".github/workflows/phase1-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify required Phase 1 files exist
        run: |
          test -f modules/auth.py
          test -f modules/storage.py
          test -f modules/config.py
          test -f modules/account_adapter.py
          test -f tests/test_auth.py
          test -f tests/test_config.py
          test -f tests/test_storage.py
          test -f tests/test_account_adapter.py
      - name: Compile Phase 1 modules
        run: python -m py_compile modules/auth.py modules/storage.py modules/config.py modules/account_adapter.py tests/test_auth.py tests/test_config.py tests/test_storage.py tests/test_account_adapter.py
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
