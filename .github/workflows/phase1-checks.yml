name: NeuroLens Phase 1 checks

on:
  push:
    branches: [neurolens-platform-phase1]
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "tests/**"
      - ".github/workflows/phase1-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Phase 1 modules
        run: python -m compileall -q modules tests
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
