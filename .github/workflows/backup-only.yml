name: NeuroLens backup-only checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [safety/backup-only-release]

jobs:
  backup-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run backup unit tests
        run: python -m unittest tests/test_db_backup.py -v
